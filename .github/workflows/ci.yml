name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}

      - name: Image tag summary
        run: |
          echo "=== Images publiées sur Docker Hub ==="
          echo "Backend : ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}"
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}"

      - name: Logout
        run: docker logout

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # On tire les images pré-buildées (tag SHA) au lieu de rebuilder depuis les sources
      - name: Pull pre-built images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }} vitalsync-backend:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }} vitalsync-frontend:latest

      - name: Start services
        run: |
          echo "DB_NAME=vitalsync"    > .env
          echo "DB_USER=postgres"    >> .env
          echo "DB_PASSWORD=testpass" >> .env
          docker compose up -d --no-build

      # Boucle de retry : on attend que le backend soit prêt (max 25s)
      - name: Health check with retry
        run: |
          for i in 1 2 3 4 5; do
            curl --fail http://localhost:3000/health && break || sleep 5
          done

      - name: Logout
        run: docker logout
