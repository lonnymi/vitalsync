version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  db-data:

services:
  backend:
    build: ./backend
    # En CI, BACKEND_IMAGE est injecté dans .env pour utiliser l'image pré-buildée (tag SHA)
    image: ${BACKEND_IMAGE:-vitalsync-backend:latest}
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app-network
    depends_on:
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-vitalsync-frontend:latest}
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
